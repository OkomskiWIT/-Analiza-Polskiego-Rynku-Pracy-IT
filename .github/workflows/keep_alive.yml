name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: 

jobs:
  ping_app:
    runs-on: ubuntu-latest
    steps:
      - name: Odwiedzenie i pełne wybudzenie strony (Ping)
        run: curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" https://kamil-rynek-it.streamlit.app > /dev/null || true
